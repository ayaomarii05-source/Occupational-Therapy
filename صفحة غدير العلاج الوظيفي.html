<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ركن العلاج الوظيفي — يومك بيشبهك؟</title>
<style>
:root{
  --ink:#2F4858; --soft:#5B6F7B; --teal:#4A8581; --teal-d:#3B6D69;
  --gold:#D9B96E; --rose:#D4958D; --blue:#7FA3C0;
  --mist:#E6EEF4; --sage:#E8F0EA; --lav:#ECE9F3; --sand:#F5EFE4; --blush:#F6E9E5; --aqua:#E0EDEB;
  --card:rgba(255,255,255,.82); --line:rgba(47,72,88,.10);
  --font:'Noto Naskh Arabic','Amiri','Traditional Arabic','Times New Roman','FreeSerif',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:var(--font);color:var(--ink);background:var(--mist);font-size:22px;line-height:1.75;overflow-x:hidden;transition:background .5s}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;font-size:inherit}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.blob{position:fixed;border-radius:50%;background:rgba(255,255,255,.55);pointer-events:none;z-index:0}
.b1{width:60vmin;height:60vmin;top:-22vmin;left:-18vmin}
.b2{width:44vmin;height:44vmin;bottom:-16vmin;right:-12vmin}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,4vmin,56px)}
.screen{width:100%;max-width:1180px;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
h1{font-size:clamp(32px,4.6vw,62px);line-height:1.4;font-weight:700}
h2{font-size:clamp(28px,3.8vw,46px);line-height:1.45;font-weight:700}
h3{font-size:clamp(22px,2.2vw,28px);font-weight:700;line-height:1.5}
.lead{font-size:clamp(20px,2.2vw,28px);color:var(--soft);max-width:30em}
.acc{color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:64px;padding:12px 38px;border-radius:40px;font-weight:700;font-size:clamp(20px,2vw,26px);border:2px solid var(--teal);background:rgba(255,255,255,.7);transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-d)}
.btn.ghost{border-color:transparent;color:var(--soft);background:transparent;min-height:52px;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.chip{display:inline-block;padding:4px 18px;border-radius:30px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:700;color:var(--soft)}
.small{font-size:16px;color:var(--soft);line-height:1.7}

/* welcome */
.welcome{display:grid;grid-template-columns:1.4fr .6fr;gap:48px;align-items:center}
.welcome .art{display:flex;align-items:center;justify-content:center}
.welcome .art svg{width:min(34vw,380px);height:auto}
.welcome .stack{display:flex;flex-direction:column;gap:26px;align-items:flex-start}
@media (max-width:820px){.welcome{grid-template-columns:1fr}.welcome .art{order:-1}.welcome .art svg{width:150px}}

/* question */
.top{display:flex;align-items:center;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:12px;border-radius:12px;background:rgba(255,255,255,.7);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:12px;transition:width .5s}
.q{font-size:clamp(28px,3.6vw,48px);line-height:1.5;font-weight:700;margin-bottom:34px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:20px;text-align:right;padding:22px 26px;min-height:96px;border-radius:30px;background:var(--card);border:2px solid var(--line);font-size:clamp(20px,2.1vw,27px);line-height:1.55;transition:transform .15s,border-color .2s,background .2s}
.opt:hover{transform:translateY(-3px);border-color:var(--teal)}
.opt .n{flex:none;width:48px;height:48px;border-radius:50%;background:var(--aqua);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;color:var(--teal-d)}
.opt.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt.sel .n{background:#fff}
.foot{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:16px}

/* info */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}
@media (max-width:860px){.cards3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:32px;padding:28px 30px}
.card h3{margin-bottom:6px}

/* result */
.res-head{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;align-items:flex-start}
.res-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:26px;align-items:stretch}
@media (max-width:900px){.res-grid{grid-template-columns:1fr}}
.radar{display:flex;align-items:center;justify-content:center}
.radar svg{width:100%;max-width:430px;height:auto;overflow:visible}
.dims{display:flex;flex-direction:column;gap:14px}
.dim{display:grid;grid-template-columns:200px 1fr auto;gap:14px;align-items:center}
.dim .nm{font-weight:700;font-size:21px}
.dim .tr{height:18px;border-radius:12px;background:rgba(47,72,88,.07);overflow:hidden}
.dim .tr i{display:block;height:100%;border-radius:12px;transition:width .9s .2s}
.lv{font-size:16px;font-weight:700;padding:2px 14px;border-radius:20px;white-space:nowrap}
.lv.s{background:#CFE3DF;color:#2F5C58}.lv.m{background:#F3E6C4;color:#6F5718}.lv.l{background:#F1D3CE;color:#8A4B44}
@media (max-width:640px){.dim{grid-template-columns:1fr auto;grid-template-areas:'nm lv' 'tr tr'}.dim .nm{grid-area:nm}.dim .lv{grid-area:lv}.dim .tr{grid-area:tr}}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:8px 0 4px}
.link{padding:8px 20px;border-radius:30px;font-weight:700;font-size:19px;position:relative}
.link.s{background:#CFE3DF}.link.m{background:#F3E6C4}.link.l{background:#F1D3CE}
.link.focus{outline:3px solid var(--ink);outline-offset:2px}
.arrow{color:var(--soft);font-size:22px}
.flag{font-size:14px;color:var(--ink);font-weight:700;display:block;line-height:1.2;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.steps{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:10px}
.steps li{display:flex;gap:14px;align-items:flex-start;font-size:22px;line-height:1.6}
.steps b{flex:none;width:38px;height:38px;border-radius:12px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.card.dark{background:var(--teal);color:#fff;border-color:var(--teal)}
.card.dark .steps b{background:#fff;color:var(--teal-d)}
.pm{margin-top:24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between}
.pm .big{font-size:clamp(24px,3vw,38px);font-weight:700}
.pm .big span{color:var(--teal)}

/* staff */
.overlay{position:fixed;inset:0;background:rgba(47,72,88,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:#fff;border-radius:32px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:32px}
.panel .dim{grid-template-columns:130px 1fr 60px;grid-template-areas:none}
.hidden{display:none!important}
@media print{
  body{background:#fff}.blob,.noprint,.foot{display:none!important}
  #app{padding:0}.screen{animation:none;max-width:none}
  .card,.link,.lv{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main id="app" aria-live="polite"></main>
<div id="staff" class="overlay hidden" role="dialog" aria-modal="true" aria-label="ملخص المشاركات"></div>

<script>
(function(){
'use strict';
/* ---------- Content ---------- */
var DIMS=[
 {id:'energy',name:'الطاقة والإرهاق الذهني',short:'الطاقة',bg:'#ECE9F3',desc:'رصيد طاقتك الذهنية وتعافيك خلال اليوم.'},
 {id:'balance',name:'التوازن الوظيفي',short:'التوازن',bg:'#F5EFE4',desc:'التوازن بين اللي لازم تعمله، واللي بدك تعمله، واللي بيشحنك.'},
 {id:'part',name:'المشاركة',short:'المشاركة',bg:'#E0EDEB',desc:'حضورك الفعلي بالأشياء والناس يلي بتهمك.'},
 {id:'env',name:'البيئة والدعم',short:'البيئة',bg:'#F6E9E5',desc:'الدعم والبيئة حواليك: ناس، شغل، بيت، ووقت.'},
 {id:'qol',name:'جودة الحياة',short:'جودة الحياة',bg:'#E6EEF4',desc:'إحساسك إنو حياتك بتشبهك وإلها معنى.'}
];
var QS=[
 {d:'energy',q:'آخر النهار، كيف طاقتك وتركيزك؟',o:['بخير وفيني أعمل شي بحبه','تعبان بس بكمّل','مشتت وبأجّل أشياء','فاضي تماماً']},
 {d:'energy',q:'نومك وراحتك هالأسبوع؟',o:['منتظم وبصحى بطاقة','أقل من اللازم أحياناً','مضروب أغلب الأيام','ما بحس إني بتعافى']},
 {d:'balance',q:'يومك بين: لازم، بدي، بيشحنني؟',o:['في تنويع بين التلاتة','واجبات أكثر، وبلاقي وقت للباقي','واجبات تقريباً كل يومي','ما في وقت لأي شي بيشحنني']},
 {d:'balance',q:'آخر مرة عملت شي بس لأنك بتحبه؟',o:['اليوم أو هالأسبوع','هالشهر','من أشهر','ما بتذكر']},
 {d:'part',q:'مع ناسك أو بشغلك، كيف بتحس؟',o:['حاضر وبستمتع','حاضر وبفكّر بغيره','حاضر جسدياً وبس','بنسحب أو بتجنّب']},
 {d:'part',q:'أشياء كنت بتحبها وتركتها؟',o:['لا، لسا مكمّل','شي بسيط','أكثر من شي','معظمها']},
 {d:'env',q:'الناس حواليك؟',o:['بدعموني وبحس بالأمان','دعم محدود','بحس لحالي','بتستنزفني']},
 {d:'env',q:'بيئة شغلك أو دراستك أو بيتك؟',o:['مريحة ومرنة','فيها ضغط وبتحمّل','ضاغطة وبتاخد وقتي','بتحدّ من خياراتي']},
 {d:'qol',q:'كم حياتك بتشبهك هالأيام؟',o:['كتير','لحد ما','قليل','ما بتشبهني']},
 {d:'qol',q:'أنشطتك إلها معنى عندك؟',o:['أغلبها','بعضها','قليل منها','تقريباً ولا شي']}
];
var TIPS={
 energy:{ot:'الأخصائي الوظيفي بيساعدك تفهم شو بيستنزف طاقتك وتنظّمها، مش بس وقتك.',steps:['سجّل 3 أشياء بتصرف طاقتك أكثر خلال يومك.','حط استراحة 10 دقايق بين المهام الكبيرة.','شغّل وضع التركيز ساعة يومياً وقلّل الإشعارات.']},
 balance:{ot:'بيساعدك ترتّب أولوياتك وترجع تحط مساحة للي بيشحنك.',steps:['اكتب نشاطات يومك وحط جنب كل وحدة: «استنزاف» أو «شحن».','ضيف نشاط واحد بيشحنك 15 دقيقة، بدون موبايل.','احمي وقت راحة قبل ما توصل للإنهاك.']},
 part:{ot:'بيساعدك ترجع تدخل أنشطة وعلاقات فقدت علاقتك فيها، بخطوات صغيرة.',steps:['اختار نشاط أو شخص بدك ترجعله هالأسبوع.','حدد له وقت ثابت بجدولك مثل أي موعد.','جرّب تحضر 10 دقايق كاملة بدون ما تفكّر بغيره.']},
 env:{ot:'بيشتغل على بيئتك وروتينك وحدودك لتناسبك.',steps:['عدّل شي صغير ببيئتك: ترتيب، ضجيج، أو موعد.','اطلب دعم محدد من شخص قريب (مو «ساعدني» عامة).','حدد حد واضح، وقت أو مهمة، وحافظ عليه.']},
 qol:{ot:'بيساعدك تحدد شو إلو معنى عندك وتبني يومك حوله.',steps:['اكتب: شو الشي يلي بيخلي حياتي تشبهني؟','اختار نشاط إله معنى عندك وأعطيه وقت هالأسبوع.','إذا الإحساس مستمر، احكي مع شخص قريب أو مختص.']}
};
var KEEP=['حافظ على وقت ثابت للأشياء يلي بتشحنك.','راقب الإشارات المبكرة للإرهاق: تشتت، عصبية، تأجيل.','شارك شخص قريب بخطوة بتحافظ فيها على توازنك.'];
var PROFILES={
 good:{t:'يومك قريب منك 🌿',s:'أغلب جوانب يومك متوازنة. حافظ على اللي بيشحنك وراقب أي تغيّر بطاقتك أو مشاركتك.'},
 drain:{t:'رصيد طاقتك عم ينزف',s:'يومك مليان واجبات وطاقتك عم تنصرف أسرع ما بتتعوّض. هاد مش كسل، هو إشارة إنو التوازن بحاجة لإعادة ترتيب.'},
 fade:{t:'انسحاب هادي من حياتك',s:'في أشياء وناس كانوا يهمّوك صار حضورك فيهم أقل. الانسحاب بيصير بالتدريج، ورجوعك بيصير بخطوات صغيرة.'},
 env:{t:'البيئة حواليك ثقيلة',s:'المشكلة مش بالضرورة فيك. الضغط والدعم والبيئة بيحدّوا خياراتك، وتعديل صغير فيها ممكن يفرق كتير.'},
 qol:{t:'حياتك بدها تشبهك أكثر',s:'يومك ماشي، بس إحساس المعنى والانتماء فيه أقل من اللي بتستاهله. نبدأ من وين بيرجع المعنى.'},
 mixed:{t:'في كفة بتحتاج انتباهك',s:'عندك نقاط قوة واضحة، وفي جانب واحد أو اثنين بحاجة اهتمام قبل ما يتحولوا لإرهاق.'}
};

/* ---------- State ---------- */
var app=document.getElementById('app'), idleT=null, tapCount=0, tapT=null;
var st={i:0,ans:[],saved:false};
var STORE='ot_corner_results_v1';

function el(h){var t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild}
function setBg(c){document.body.style.background=c}
function show(node){app.innerHTML='';app.appendChild(node);window.scrollTo(0,0)}
function resetIdle(ms){clearTimeout(idleT);if(ms)idleT=setTimeout(function(){reset();},ms)}
['click','touchstart','keydown'].forEach(function(e){document.addEventListener(e,function(){if(st.mode)resetIdle(st.mode==='result'?240000:150000)},{passive:true})});

/* ---------- Screens ---------- */
var MOON='<svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="#fff" fill-opacity=".6"/><path d="M128 48a56 56 0 1 0 0 104 70 70 0 0 1 0-104z" fill="#4A8581"/><circle cx="150" cy="60" r="5" fill="#D9B96E"/><circle cx="162" cy="92" r="3.5" fill="#8FB8B3"/><circle cx="48" cy="150" r="4" fill="#D4958D"/></svg>';

function welcome(){
  st.mode='welcome';resetIdle(0);setBg('#E6EEF4');
  var n=el('<section class="screen welcome"><div class="stack">'+
   '<span class="chip" id="tapzone">ركن العلاج الوظيفي · يوم العلاج الوظيفي العالمي</span>'+
   '<h1>يومك مليان…<br><span class="acc">بس حاسس إنك مش عايش فيه؟</span></h1>'+
   '<p class="lead">'+QS.length+' أسئلة قصيرة، دقيقة ونص تقريباً. بتطلع بصورة عن يومك: وين طاقتك، وشو بيشحنك، ومن وين تبدأ.</p>'+
   '<div class="row"><button class="btn primary" id="go">ابدأ</button><button class="btn" id="info">شو هو العلاج الوظيفي؟</button></div>'+
   '<p class="small">مجهول الهوية، ولا نجمع أي معلومة شخصية. هاد توعية وليس تقييماً صحياً.</p>'+
   '</div><div class="art">'+MOON+'</div></section>');
  show(n);
  n.querySelector('#go').onclick=start;
  n.querySelector('#info').onclick=info;
  n.querySelector('#tapzone').onclick=function(){tapCount++;clearTimeout(tapT);tapT=setTimeout(function(){tapCount=0},3000);if(tapCount>=5){tapCount=0;staff()}};
}
function info(){
  st.mode='info';resetIdle(150000);setBg('#ECE9F3');
  var n=el('<section class="screen"><h2>شو هو العلاج الوظيفي؟</h2>'+
  '<div class="cards3">'+
  '<div class="card"><h3 dir="ltr" style="text-align:right">Occupation</h3><p>كل شي بتعمله بيومك: أكلك، نومك، شغلك، دراستك، هواياتك، علاقاتك، راحتك.</p></div>'+
  '<div class="card"><h3>ثلاث زوايا</h3><p>بنشوف يومك من إنت، والنشاط، والبيئة، وبنجرب تعديلات صغيرة على قياسك.</p></div>'+
  '<div class="card"><h3>لمين؟</h3><p>لكل شخص بدو يومه يناسب طاقته، مش بس للمرضى أو لذوي الإعاقة.</p></div>'+
  '</div><p class="lead acc" style="font-weight:700">العلاج الوظيفي مش عن الوظيفة… هو عن حياتك.</p>'+
  '<div class="row" style="margin-top:26px"><button class="btn primary" id="go">ابدأ الأسئلة</button><button class="btn ghost" id="back">رجوع</button></div></section>');
  show(n);n.querySelector('#go').onclick=start;n.querySelector('#back').onclick=welcome;
}
function start(){st.i=0;st.ans=[];st.saved=false;question()}
function question(){
  st.mode='q';resetIdle(150000);
  var q=QS[st.i], d=DIMS.filter(function(x){return x.id===q.d})[0];
  setBg(d.bg);
  var pct=Math.round(st.i/QS.length*100);
  var opts=q.o.map(function(t,k){return '<button class="opt'+(st.ans[st.i]===k?' sel':'')+'" data-k="'+k+'"><span class="n">'+(k+1)+'</span><span>'+t+'</span></button>'}).join('');
  var n=el('<section class="screen"><div class="top"><span class="chip">'+d.name+'</span>'+
   '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+QS.length+'" aria-valuenow="'+st.i+'"><i style="width:'+pct+'%"></i></div>'+
   '<span class="small">'+(st.i+1)+' من '+QS.length+'</span></div>'+
   '<h2 class="q">'+q.q+'</h2><div class="opts">'+opts+'</div>'+
   '<div class="foot"><button class="btn ghost" id="prev"'+(st.i===0?' style="visibility:hidden"':'')+'>→ السابق</button><button class="btn ghost" id="home">إلغاء</button></div></section>');
  show(n);
  n.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.k,n)}});
  n.querySelector('#prev').onclick=function(){st.i=Math.max(0,st.i-1);question()};
  n.querySelector('#home').onclick=welcome;
}
function pick(k,n){
  st.ans[st.i]=k;
  n.querySelectorAll('.opt').forEach(function(b){b.classList.toggle('sel',+b.dataset.k===k)});
  setTimeout(function(){ if(st.i<QS.length-1){st.i++;question()}else{result()} },320);
}
document.addEventListener('keydown',function(e){
  if(st.mode!=='q')return; var k=parseInt(e.key,10);
  if(k>=1&&k<=4){var b=app.querySelectorAll('.opt')[k-1]; if(b)b.click()}
});

/* ---------- Scoring ---------- */
function score(){
  var sums={},cnt={};
  DIMS.forEach(function(d){sums[d.id]=0;cnt[d.id]=0});
  QS.forEach(function(q,i){var v=3-(st.ans[i]||0);sums[q.d]+=v;cnt[q.d]+=1});
  var out={},tot=0;
  DIMS.forEach(function(d){out[d.id]=Math.round(sums[d.id]/(cnt[d.id]*3)*100);tot+=out[d.id]});
  out.overall=Math.round(tot/DIMS.length);return out;
}
function level(p){return p>=70?'s':(p>=45?'m':'l')}
var LVT={s:'نقطة قوة',m:'بحاجة انتباه',l:'أولوية للتحسين'};
function weakest(sc){var w=DIMS[0];DIMS.forEach(function(d){if(sc[d.id]<sc[w.id])w=d});return w}
function strongest(sc){var w=DIMS[0];DIMS.forEach(function(d){if(sc[d.id]>sc[w.id])w=d});return w}
function profile(sc){
  if(sc.overall>=70&&Math.min.apply(null,DIMS.map(function(d){return sc[d.id]}))>=50)return 'good';
  if(sc.energy<55&&sc.balance<55)return 'drain';
  var w=weakest(sc);
  if(w.id==='part'||sc.part<50)return 'fade';
  if(w.id==='env'&&sc.env<60)return 'env';
  if(w.id==='qol'&&sc.qol<60)return 'qol';
  return 'mixed';
}

/* ---------- Result ---------- */
function radar(sc){
  var cx=215,cy=200,R=120,N=DIMS.length,s='';
  function pt(i,r){var a=-Math.PI/2-i*2*Math.PI/N;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
  [25,50,75,100].forEach(function(l){
    s+='<polygon points="'+DIMS.map(function(_,i){return pt(i,R*l/100).join(',')}).join(' ')+'" fill="none" stroke="rgba(47,72,88,.14)" stroke-width="1.5"/>';
  });
  DIMS.forEach(function(_,i){var p=pt(i,R);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="rgba(47,72,88,.10)"/>'});
  var poly=DIMS.map(function(d,i){return pt(i,R*Math.max(sc[d.id],6)/100).join(',')}).join(' ');
  s+='<polygon points="'+poly+'" fill="rgba(74,133,129,.28)" stroke="#4A8581" stroke-width="3" stroke-linejoin="round"/>';
  DIMS.forEach(function(d,i){var p=pt(i,R*Math.max(sc[d.id],6)/100);s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="6" fill="#4A8581"/>';
    var l=pt(i,R+(Math.abs(Math.cos(-Math.PI/2-i*2*Math.PI/N))>.3?64:38));var anchor=l[0]<cx-10?'end':(l[0]>cx+10?'start':'middle');
    s+='<text x="'+l[0]+'" y="'+(l[1]+5)+'" text-anchor="'+anchor+'" font-size="19" font-weight="700" fill="#2F4858" font-family="inherit">'+d.short+'</text>'});
  return '<svg viewBox="0 0 430 400" role="img" aria-label="رسم راداري لنتائجك في خمسة محاور">'+s+'</svg>';
}
function result(){
  st.mode='result';resetIdle(240000);setBg('#E8F0EA');
  var sc=score(), pf=PROFILES[profile(sc)], w=weakest(sc), s=strongest(sc);
  if(!st.saved){save(sc,w.id);st.saved=true}
  var dims=DIMS.map(function(d){var p=sc[d.id],l=level(p);
    return '<div class="dim"><span class="nm">'+d.name+'</span><div class="tr"><i style="width:0;background:'+(l==='s'?'#4A8581':l==='m'?'#D9B96E':'#D4958D')+'" data-w="'+p+'%"></i></div><span class="lv '+l+'">'+LVT[l]+'</span></div>'}).join('');
  var chain=DIMS.map(function(d,i){var l=level(sc[d.id]);
    return (i?'<span class="arrow" aria-hidden="true">←</span>':'')+'<span class="link '+l+(d.id===w.id&&sc[w.id]<70?' focus':'')+'">'+d.short+(d.id===w.id&&sc[w.id]<70?'<span class="flag">ابدأ من هون</span>':'')+'</span>'}).join('');
  var tip=TIPS[w.id];
  var good=sc.overall>=70&&sc[w.id]>=50;
  var useSteps=good?KEEP:tip.steps;
  var steps=useSteps.map(function(t,i){return '<li><b>'+(i+1)+'</b><span>'+t+'</span></li>'}).join('');
  var strongCard=sc[s.id]>=50?('<h3>نقطة قوتك: '+s.name+'</h3><p>'+s.desc+' حافظ عليها لأنها بتسندك بباقي المحاور.</p>'):('<h3>حتى لو كل شي بحاجة اهتمام</h3><p>إنك وقفت وسألت حالك هي بحد ذاتها خطوة. ابدأ بخطوة وحدة صغيرة، مش بتغيير كامل.</p>');
  var n=el('<section class="screen"><div class="res-head"><span class="chip">نتيجتك · مؤشر عام '+sc.overall+'%</span><h1>'+pf.t+'</h1><p class="lead" style="max-width:36em">'+pf.s+'</p></div>'+
   '<div class="res-grid"><div class="card radar">'+radar(sc)+'</div><div class="card"><h3>محاور يومك</h3><div class="dims" style="margin-top:14px">'+dims+'</div></div></div>'+
   '<div class="card" style="margin-top:20px"><h3>كيف بتتأثر ببعضها؟</h3><p class="small" style="font-size:18px">الإرهاق بيأثر على التوازن، والتوازن على المشاركة، والمشاركة على جودة حياتك.</p><div class="chain">'+chain+'</div></div>'+
   '<div class="two"><div class="card dark"><h3>'+(good?'خطوتك للحفاظ على التوازن':'خطوتك الأولى: '+w.name)+'</h3><ol class="steps">'+steps+'</ol><p class="small" style="color:#fff;margin-top:12px;opacity:.92">مش لازم تعمل الثلاثة، ابدأ بواحدة.</p></div>'+
   '<div class="card">'+strongCard+'<h3 style="margin-top:18px">وين العلاج الوظيفي؟</h3><p>'+(good?'بيساعدك تحافظ على توازنك وتلاحظ الإشارات المبكرة قبل ما تتحول لإرهاق.':tip.ot)+'</p></div></div>'+
   '<div class="pm"><div class="big" dir="ltr">Participation <span>Matters</span> <span style="font-size:.6em;color:var(--soft);font-weight:400" dir="rtl">· مشاركتك بحياتك مهمة</span></div>'+
   '<div class="row noprint"><button class="btn" id="print">اطبع نتيجتي</button><button class="btn primary" id="again">ابدأ من جديد</button></div></div>'+
   '<p class="small" style="margin-top:16px">توعية عامة وليست تشخيصاً أو تقييماً صحياً. إذا عندك أعراض مستمرة أو شديدة (نوم، مزاج، قلق)، راجع مختصاً.</p></section>');
  show(n);
  requestAnimationFrame(function(){requestAnimationFrame(function(){n.querySelectorAll('.tr i').forEach(function(i){i.style.width=i.dataset.w})})});
  n.querySelector('#again').onclick=reset;
  n.querySelector('#print').onclick=function(){window.print()};
}
function reset(){st={i:0,ans:[],saved:false};welcome()}

/* ---------- Anonymous aggregate (stored only on this device) ---------- */
function load(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch(e){return []}}
function save(sc,weak){try{var a=load();a.push({t:Date.now(),s:{energy:sc.energy,balance:sc.balance,part:sc.part,env:sc.env,qol:sc.qol},o:sc.overall,w:weak});localStorage.setItem(STORE,JSON.stringify(a))}catch(e){}}
function staff(){
  var a=load(),box=document.getElementById('staff');
  var avg={},weak={};DIMS.forEach(function(d){avg[d.id]=0;weak[d.id]=0});
  a.forEach(function(r){DIMS.forEach(function(d){avg[d.id]+=r.s[d.id]});weak[r.w]=(weak[r.w]||0)+1});
  var rows=DIMS.map(function(d){var m=a.length?Math.round(avg[d.id]/a.length):0,l=level(m);
    return '<div class="dim"><span class="nm">'+d.short+'</span><div class="tr"><i style="width:'+m+'%;background:'+(l==='s'?'#4A8581':l==='m'?'#D9B96E':'#D4958D')+'"></i></div><b>'+m+'%</b></div>'}).join('');
  var top=DIMS.slice().sort(function(x,y){return weak[y.id]-weak[x.id]})[0];
  box.innerHTML='<div class="panel"><h2>ملخص المشاركات (على هذا الجهاز فقط)</h2>'+
   '<p class="lead" style="margin:8px 0 18px">عدد المشاركين: <b>'+a.length+'</b>'+(a.length?' · أكثر محور بحاجة اهتمام: <b>'+top.name+'</b> ('+weak[top.id]+' مشارك)':'')+'</p>'+
   '<div class="dims">'+rows+'</div>'+
   '<p class="small" style="margin-top:16px">المتوسطات مجهولة الهوية ولا تحتوي أي معلومة شخصية. يمكن استخدامها بلوحة ختامية: «شو لاحظنا اليوم؟»</p>'+
   '<div class="row" style="margin-top:20px"><button class="btn" id="csv">تصدير CSV</button><button class="btn" id="clr">مسح البيانات</button><button class="btn primary" id="cls">إغلاق</button></div></div>';
  box.classList.remove('hidden');
  box.querySelector('#cls').onclick=function(){box.classList.add('hidden')};
  var clrBtn=box.querySelector('#clr'),armed=false;
  clrBtn.onclick=function(){if(!armed){armed=true;clrBtn.textContent='اضغط مرة ثانية للتأكيد';setTimeout(function(){armed=false;clrBtn.textContent='مسح البيانات'},4000);return}try{localStorage.removeItem(STORE)}catch(e){}staff()};
  var csvBtn=box.querySelector('#csv');
  csvBtn.onclick=function(){
    var csv='time,energy,balance,participation,environment,qol,overall,weakest\n'+a.map(function(r){return [new Date(r.t).toISOString(),r.s.energy,r.s.balance,r.s.part,r.s.env,r.s.qol,r.o,r.w].join(',')}).join('\n');
    var u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));var l=document.createElement('a');l.href=u;l.download='ot_corner_results.csv';l.click();setTimeout(function(){URL.revokeObjectURL(u)},500)};
}
welcome();
})();
</script>
